plugins {
    id 'org.beryx.runtime' version '1.13.1'
}

sourceCompatibility = 1.17

sourceSets.main.java.srcDirs = [ "src/" ]

project.ext.mainClassName = "com.etheller.warsmash.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets");

import org.gradle.internal.os.OperatingSystem

if(project.hasProperty("args")) {
    ext.cmdargs = project.getProperty("args")
} else {
    ext.cmdargs = ""
}

application {
	mainClass = project.ext.mainClassName
	applicationName = 'warsmash'
	applicationDefaultJvmArgs = []
}

task runGame(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    args cmdargs.split()
}

task campaignNativeAudit(dependsOn: classes, type: JavaExec) {
    description = "Reports which common.j natives the retail campaigns reach but the engine does not implement."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignNativeAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignCinematicRefs(dependsOn: classes, type: JavaExec) {
    description = "Dumps cinematic asset refs (sky/camera/model-cinematic) in retail campaign scripts and validates them against the archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignCinematicRefs"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignBackingAudit(dependsOn: classes, type: JavaExec) {
    description = "Audits Warcraft III 3D and 2D menu backing screens, cameras, sequences, and skin resolution against retail archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignBackingScreensAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignProgressionAudit(dependsOn: classes, type: JavaExec) {
    description = "Audits Warcraft III single-player campaign progression, ChangeLevel map chaining, and gamecache continuity against retail archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignProgressionAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignSoakAudit(dependsOn: classes, type: JavaExec) {
    description = "Executes an automated headless soak test across all 85 retail campaign maps, stepping 300 simulation ticks each."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignSoakTestRunner"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    maxHeapSize = "3072m"
    args cmdargs.split()
}

task runViewer(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.desktop.editor.mdx.MdxEditorMain"
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    args cmdargs.split()
}

task debug(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from {configurations.runtimeClasspath.collect {zipTree(it)}}
    from files(project.assetsDir)

    with jar
}

dist.dependsOn classes

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/core/assets'
    }
}

task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}
