            throw new GradleException("Frozen Throne opening playthrough failed; see $report")
        }
        println "PASS: original Frozen Throne pursuit, ship defense and Maiev carryover; report: $report; home: $auditHome"
    }
}

task humanExpansionOpeningPlaythroughAudit(dependsOn: classes, type: JavaExec) {
    description = 'Plays the original Blood Elf introduction and repairs the first Observatory.'
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = java.time.Duration.ofMinutes(12)
    def auditHome = file("$buildDir/human-expansion-opening-home-${System.currentTimeMillis()}")
    def report = file("$buildDir/human-expansion-opening.log")
    def allObservatories = (project.findProperty('humanExpansionOpeningAllObservatories') ?: 'false').toString().toBoolean()
    def secondObservatory = allObservatories || (project.findProperty('humanExpansionOpeningSecondObservatory') ?: 'false').toString().toBoolean()
    def cache = secondObservatory || (project.findProperty('humanExpansionOpeningCache') ?: 'false').toString().toBoolean()
    def landing = cache || (project.findProperty('humanExpansionOpeningLanding') ?: 'false').toString().toBoolean()
    def boats = landing || (project.findProperty('humanExpansionOpeningBoats') ?: 'false').toString().toBoolean()
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.humanExpansionOpeningAudit', 'true'
    systemProperty 'warsmash.humanExpansionOpeningBoats', boats.toString()
    systemProperty 'warsmash.humanExpansionOpeningLanding', landing.toString()
    systemProperty 'warsmash.humanExpansionOpeningCache', cache.toString()
    systemProperty 'warsmash.humanExpansionOpeningSecondObservatory', secondObservatory.toString()
    systemProperty 'warsmash.humanExpansionOpeningAllObservatories', allObservatories.toString()
    systemProperty 'warsmash.humanExpansionOpeningAuditTicksPerFrame',
            (project.findProperty('humanExpansionOpeningAuditTicksPerFrame') ?: '0').toString()
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile',
            'Maps\\FrozenThrone\\Campaign\\HumanX01.w3x'
    ignoreExitValue = true
    doFirst {
        freezeAuditRuntime(delegate, auditHome, false)
        def options = new File(auditHome, '.warsmash/options.properties')
        options.parentFile.mkdirs()
        options.text = 'musicEnabled=false\nsoundEnabled=false\n'
        standardOutput = new FileOutputStream(report)
        errorOutput = standardOutput
    }
    doLast {
        standardOutput.close()
        def output = report.getText('UTF-8')
        if (!output.contains('[HumanExpansionOpeningProbe] watched Kael\'s original introduction and received the Observatory quest')
                || !output.contains('[HumanExpansionOpeningProbe] repaired the first original Observatory and triggered its reveal')
                || boats && !output.contains('[HumanExpansionOpeningProbe] reached the original shore, watched Vashj\'s cinematic and received both transports')
                || landing && !output.contains('[HumanExpansionOpeningProbe] landed Kael and the repair worker below the second Observatory')
                || cache && !output.contains('[HumanExpansionOpeningProbe] collected the original Tiny Castle from the hidden cache')
                || secondObservatory && !output.contains('[HumanExpansionOpeningProbe] repaired the second Observatory with harvested lumber')
                || allObservatories && !output.contains('[HumanExpansionOpeningProbe] repaired all three original Observatories and reached the native victory')
                || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Human expansion opening audit:')) {
            throw new GradleException("Human expansion opening failed; see $report")
        }
        def milestone = allObservatories ? 'all three Observatory repairs and Misconceptions victory'
                : secondObservatory ? 'second Observatory repair with harvested lumber'
                : landing ? 'Naga transport crossing and landing below the second Observatory'
                : boats ? 'first Observatory repair and Naga transport handoff' : 'Blood Elf introduction and first Observatory repair'
        println "PASS: original $milestone; report: $report"
    }
}

