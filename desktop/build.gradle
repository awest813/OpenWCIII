plugins {
    id 'org.beryx.runtime' version '1.13.1'
}

sourceCompatibility = 1.17

sourceSets.main.java.srcDirs = [ "src/" ]

project.ext.mainClassName = "com.etheller.warsmash.desktop.DesktopLauncher"
project.ext.assetsDir = new File("../core/assets");

import org.gradle.internal.os.OperatingSystem

if(project.hasProperty("args")) {
    ext.cmdargs = project.getProperty("args")
} else {
    ext.cmdargs = ""
}

application {
	mainClass = project.ext.mainClassName
	applicationName = 'warsmash'
	applicationDefaultJvmArgs = []
}

task runGame(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    args cmdargs.split()
    if (project.hasProperty('startupProbeSeconds')) {
        systemProperty 'warsmash.startupProbeSeconds', project.property('startupProbeSeconds')
    }
}

task campaignNativeAudit(dependsOn: classes, type: JavaExec) {
    description = "Reports which common.j natives the retail campaigns reach but the engine does not implement."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignNativeAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignCinematicRefs(dependsOn: classes, type: JavaExec) {
    description = "Dumps cinematic asset refs (sky/camera/model-cinematic) in retail campaign scripts and validates them against the archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignCinematicRefs"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task skyBackgroundRenderAudit(dependsOn: classes, type: JavaExec) {
    description = "Runs an OpenGL pixel regression for cinematic sky/terrain depth ordering (requires a desktop)."
    mainClass = "com.etheller.warsmash.desktop.tools.SkyBackgroundRenderAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
}

task graphicsSettingsRenderAudit(dependsOn: classes, type: JavaExec) {
    description = "Checks graphics quality changes against a real OpenGL context."
    mainClass = "com.etheller.warsmash.desktop.tools.GraphicsSettingsRenderAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
}

task graphicsSettingsMapAudit(dependsOn: classes, type: JavaExec) {
    description = "Smoke-tests a retail map at a chosen graphics quality using isolated preferences."
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    def auditHome = file("$buildDir/graphics-audit-home")
    def quality = project.findProperty('graphicsQuality') ?: '0'
    def auditOutput = new ByteArrayOutputStream()
    standardOutput = auditOutput
    errorOutput = auditOutput
    ignoreExitValue = true
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.startupProbeSeconds', '8'
    systemProperty 'warsmash.graphicsProbe', 'true'
    args '--profile=safe', '--width=960', '--height=540', '--fps=30', '--msaa=0', '--novsync',
            '-nolog', '-loadfile', 'Maps\\Campaign\\Human01.w3m'
    doFirst {
        def optionsFile = new File(auditHome, '.warsmash/options.properties')
        optionsFile.parentFile.mkdirs()
        optionsFile.text = "modelDetail=$quality\nanimationQuality=$quality\ntextureQuality=$quality\n" +
                "particleQuality=$quality\nlocalLights=${quality != '0'}\nshadows=${quality != '0'}\n" +
                "occlusion=true\nmusicEnabled=false\nsoundEnabled=false\n"
    }
    doLast {
        def output = auditOutput.toString('UTF-8')
        def report = file("$buildDir/graphics-map-${quality}.log")
        report.text = output
        // The bundled LWJGL backend exits -1 even after normal shutdown. Require
        // the render-thread completion marker, rather than masking exit codes alone.
        if (!output.contains('[StartupProbe] complete') || output.contains('GL ERROR:') ||
                !output.contains('[GraphicsProbe] quality=2') ||
                !output.contains('Display: windowed 960x540') || !output.contains('VSync: disabled') ||
                !output.contains('FPS cap: fg=30, bg=30') || !output.contains('MSAA samples: 0')) {
            throw new GradleException("Graphics map audit failed; see $report")
        }
        println "PASS: retail map rendered and switched graphics quality; report: $report"
    }
}

task campaignBackingAudit(dependsOn: classes, type: JavaExec) {
    description = "Audits Warcraft III 3D and 2D menu backing screens, cameras, sequences, and skin resolution against retail archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignBackingScreensAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignProgressionAudit(dependsOn: classes, type: JavaExec) {
    description = "Audits Warcraft III single-player campaign progression, ChangeLevel map chaining, and gamecache continuity against retail archives."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignProgressionAudit"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    args cmdargs.split()
}

task campaignSoakAudit(dependsOn: classes, type: JavaExec) {
    description = "Executes an automated headless soak test across all 85 retail campaign maps, stepping 300 simulation ticks each."
    mainClass = "com.etheller.warsmash.desktop.tools.CampaignSoakTestRunner"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.rootDir
    maxHeapSize = "3072m"
    args cmdargs.split()
}

task runViewer(dependsOn: classes, type: JavaExec) {
    mainClass = "com.etheller.warsmash.desktop.editor.mdx.MdxEditorMain"
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    args cmdargs.split()
}

task debug(dependsOn: classes, type: JavaExec) {
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    standardInput = System.in
    workingDir = project.assetsDir
    ignoreExitValue = true
    debug = true
}

task dist(type: Jar) {
    duplicatesStrategy(DuplicatesStrategy.EXCLUDE)
    manifest {
        attributes 'Main-Class': project.mainClassName
    }
    dependsOn configurations.runtimeClasspath

    from files(sourceSets.main.output.classesDirs)
    from files(sourceSets.main.output.resourcesDir)
    from {configurations.runtimeClasspath.collect {zipTree(it)}}
    from files(project.assetsDir)

    with jar
}

dist.dependsOn classes

eclipse {
    project {
        name = appName + "-desktop"
        linkedResource name: 'assets', type: '2', location: 'PARENT-1-PROJECT_LOC/core/assets'
    }
}

task afterEclipseImport(description: "Post processing after project generation", group: "IDE") {
  doLast {
    def classpath = new XmlParser().parse(file(".classpath"))
    new Node(classpath, "classpathentry", [ kind: 'src', path: 'assets' ]);
    def writer = new FileWriter(file(".classpath"))
    def printer = new XmlNodePrinter(new PrintWriter(writer))
    printer.setPreserveWhitespace(true)
    printer.print(classpath)
  }
}


task menuGraphicsAudit(dependsOn: classes, type: JavaExec) {
    description = "Renders and captures the main menu in 4:3, widescreen, and portrait windows."
    mainClass = "com.etheller.warsmash.desktop.DesktopLauncher"
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    def auditHome = file("$buildDir/menu-audit-home")
    def captures = file("$buildDir/menu-audit-captures")
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.menuAuditDirectory', captures.absolutePath
    args '--profile=safe', '--width=800', '--height=600', '--fps=30', '--msaa=0', '-nolog'
    def auditOutput = new ByteArrayOutputStream()
    standardOutput = auditOutput
    errorOutput = auditOutput
    ignoreExitValue = true
    doFirst {
        captures.mkdirs()
        def optionsFile = new File(auditHome, '.warsmash/options.properties')
        optionsFile.parentFile.mkdirs()
        optionsFile.text = 'musicEnabled=false\nsoundEnabled=false\n'
    }
    doLast {
        def output = auditOutput.toString('UTF-8')
        file("$buildDir/menu-audit.log").text = output
        if (!output.contains('[MenuRenderProbe] complete') || output.contains('GL ERROR:')) {
            throw new GradleException("Menu audit failed; see $buildDir/menu-audit.log")
        }
        println "PASS: menu rendered at three sizes; captures: $captures"
    }
}
