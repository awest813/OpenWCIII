        if (!resumeInterlude && (!output.contains('[OrcLumberProbe] the original Pillage research event fired')
                    || !output.contains('[OrcLumberProbe] earned the original 3000 lumber bonus through ordinary attacks')
                    || playthrough && !output.contains('[OrcLumberProbe] completed the original 15000 lumber objective'))
                || (playthrough || resumeInterlude) && (!output.contains('[OrcLumberProbe] entered the original Orc04 story interlude')
                    || !output.contains('[OrcLumberProbe] entered Orc05 and verified Grom carryover'))
                || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Orc lumber audit:')) {
            throw new GradleException("Orc04 lumber audit failed; see $report")
        }
        def milestone = resumeInterlude ? 'Orc04 story interlude and earned Grom carryover'
                : playthrough ? 'Orc04 original lumber victory and Grom carryover' : 'Orc04 original Pillage research and first lumber bonus'
        println "PASS: $milestone; report: $report; home: $auditHome"
    }
}

