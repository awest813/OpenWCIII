task frozenThroneOpeningPlaythroughAudit(dependsOn: classes, type: JavaExec) {
    description = 'Plays the original Frozen Throne Night Elf opening and verifies Maiev in the next chapter.'
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = java.time.Duration.ofMinutes(20)
    def auditHome = file("$buildDir/frozen-throne-opening-home-${System.currentTimeMillis()}")
    def report = file("$buildDir/frozen-throne-opening.log")
    def checkpoint = project.findProperty('frozenThroneOpeningCheckpoint')
    def saveHarbor = project.findProperty('frozenThroneOpeningSaveHarbor')
    def checkpointRuntimeHome = project.findProperty('frozenThroneOpeningRuntimeHome')
    def islandCache = project.findProperty('frozenThroneIslandCache')
    def tombCache = project.findProperty('frozenThroneTombCache')
    def afterTombCache = project.findProperty('frozenThroneAfterTombCache')
    def afterTombSeaEscape = (project.findProperty('frozenThroneAfterTombSeaEscape') ?: 'false').toString().toBoolean()
    def afterTombRunner = afterTombSeaEscape || (project.findProperty('frozenThroneAfterTombRunner') ?: 'false').toString().toBoolean()
    def tombEscape = (project.findProperty('frozenThroneTombEscape') ?: 'false').toString().toBoolean()
    def tombEye = tombEscape || (project.findProperty('frozenThroneTombEye') ?: 'false').toString().toBoolean()
    def thirdTombBarrier = tombEye || (project.findProperty('frozenThroneTombThirdBarrier') ?: 'false').toString().toBoolean()
    def secondTombBarrier = thirdTombBarrier || (project.findProperty('frozenThroneTombSecondBarrier') ?: 'false').toString().toBoolean()
    def firstTombBarrier = secondTombBarrier || (project.findProperty('frozenThroneTombFirstBarrier') ?: 'false').toString().toBoolean()
    def islandPlaythrough = (project.findProperty('frozenThroneIslandPlaythrough') ?: 'false').toString().toBoolean()
    def islandLandfall = islandPlaythrough || (project.findProperty('frozenThroneIslandLandfall') ?: 'false').toString().toBoolean()
    def islandVoyage = islandLandfall || (project.findProperty('frozenThroneIslandVoyage') ?: 'false').toString().toBoolean()
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.frozenThroneOpeningAudit', 'true'
    systemProperty 'warsmash.frozenThroneOpeningAuditTicksPerFrame', (project.findProperty('frozenThroneOpeningAuditTicksPerFrame') ?: '0').toString()
    if (checkpoint != null) systemProperty 'warsmash.frozenThroneOpeningResumeHarbor', 'true'
    if (saveHarbor != null) systemProperty 'warsmash.frozenThroneOpeningSaveHarbor', file(saveHarbor).absolutePath
    if (islandCache != null) systemProperty 'warsmash.frozenThroneIslandOpening', 'true'
    if (tombCache != null) systemProperty 'warsmash.frozenThroneTombOpening', 'true'
    if (afterTombCache != null) systemProperty 'warsmash.frozenThroneAfterTomb', 'true'
    systemProperty 'warsmash.frozenThroneAfterTombRunner', afterTombRunner.toString()
    systemProperty 'warsmash.frozenThroneAfterTombSeaEscape', afterTombSeaEscape.toString()
    systemProperty 'warsmash.frozenThroneTombFirstBarrier', firstTombBarrier.toString()
    systemProperty 'warsmash.frozenThroneTombSecondBarrier', secondTombBarrier.toString()
    systemProperty 'warsmash.frozenThroneTombThirdBarrier', thirdTombBarrier.toString()
    systemProperty 'warsmash.frozenThroneTombEye', tombEye.toString()
    systemProperty 'warsmash.frozenThroneTombEscape', tombEscape.toString()
    systemProperty 'warsmash.frozenThroneIslandVoyage', islandVoyage.toString()
    systemProperty 'warsmash.frozenThroneIslandLandfall', islandLandfall.toString()
    systemProperty 'warsmash.frozenThroneIslandPlaythrough', islandPlaythrough.toString()
    def chapter = afterTombCache != null ? 'NightElfX04.w3x' : tombCache != null ? 'NightElfX03.w3x'
            : islandCache != null ? 'NightElfX02.w3x' : 'NightElfX01.w3x'
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile',
        checkpoint == null ? "Maps\\FrozenThrone\\Campaign\\${chapter}".toString() : file(checkpoint).absolutePath
    ignoreExitValue = true
    doFirst {
        if (islandPlaythrough && islandCache == null) throw new GradleException('The island playthrough requires the earned NightElfX01 cache')
        if (firstTombBarrier && tombCache == null) throw new GradleException('The tomb barrier requires the earned NightElfX02 cache')
        freezeAuditRuntime(delegate, checkpointRuntimeHome == null ? auditHome : file(checkpointRuntimeHome),
                checkpointRuntimeHome != null)
        def options = new File(auditHome, '.warsmash/options.properties')
        options.parentFile.mkdirs()
        options.text = 'musicEnabled=false\nsoundEnabled=false\n'
        def earnedCache = afterTombCache ?: tombCache ?: islandCache
        if (earnedCache != null) {
            def source = file(earnedCache)
            if (!source.isDirectory()) throw new GradleException("Earned Maiev cache does not exist: $source")
            copy {
                from source
                into new File(auditHome, '.warsmash/gamecache')
            }
        }
        standardOutput = new FileOutputStream(report)
        errorOutput = standardOutput
    }
    doLast {
        standardOutput.close()
        def output = report.getText('UTF-8')
        if (afterTombCache != null) {
            if (!output.contains('[FrozenThroneOpeningProbe] restored earned Maiev for the original NightElfX04 boat rescue')
                    || !output.contains('[FrozenThroneOpeningProbe] completed the original NightElfX04 boat rescue through normal orders')
                    || afterTombRunner && !output.contains('[FrozenThroneOpeningProbe] boarded the original NightElfX04 runner in a rescued transport')
                    || afterTombSeaEscape && !output.contains('[FrozenThroneOpeningProbe] sailed the courier into the original NightElfX04 escape region')
                    || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Frozen Throne opening audit:')) {
                throw new GradleException("Frozen Throne NightElfX04 boat rescue failed; see $report")
            }
            def milestone = afterTombSeaEscape ? 'boat rescue and original courier escape' : afterTombRunner ? 'boat rescue and runner boarding' : 'boat rescue with earned Maiev'
            println "PASS: original NightElfX04 $milestone; report: $report"
            return
        }
        if (tombCache != null) {
            if (!output.contains('[FrozenThroneOpeningProbe] watched the original tomb introduction and restored earned Maiev')
                    || !output.contains('[FrozenThroneOpeningProbe] reached the original Tomb of Sargeras Blink hint')
                    || !output.contains('[FrozenThroneOpeningProbe] used Blink to claim the original Rune of Mana')
                    || firstTombBarrier && !output.contains('[FrozenThroneOpeningProbe] destroyed the first original rock barrier and freed the Watchers')
                    || secondTombBarrier && (!output.contains('[FrozenThroneOpeningProbe] the original floor switch opened the lower tomb passage')
                            || !output.contains('[FrozenThroneOpeningProbe] destroyed the second original rock barrier and freed the Dryads'))
                    || thirdTombBarrier && (!output.contains('[FrozenThroneOpeningProbe] Maiev blinked across the river and raised the original tomb bridge')
                            || !output.contains('[FrozenThroneOpeningProbe] crossed the original tomb bridge, rescued the third party and completed the barrier quest'))
                    || tombEye && !output.contains('[FrozenThroneOpeningProbe] broke through the original Eye chamber, watched Illidan\'s cinematic and started the timed escape')
                    || tombEscape && (!output.contains('[FrozenThroneOpeningProbe] reached the original Tomb exit before the timer expired')
                            || !output.contains('[FrozenThroneOpeningProbe] entered NightElfX04 and verified Maiev carryover after escaping the tomb'))
                    || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Frozen Throne opening audit:')) {
                throw new GradleException("Frozen Throne Tomb of Sargeras opening failed; see $report")
            }
            def milestone = tombEscape ? 'timed escape, native victory and earned carryover to NightElfX04'
                    : tombEye ? 'Eye chamber cinematic and escape timer'
                    : thirdTombBarrier ? 'bridge crossing and complete original barrier quest'
                    : secondTombBarrier ? 'floor switch, first two barriers, and rescue'
                    : firstTombBarrier ? 'first barrier and Watcher rescue' : 'introduction, earned Maiev, Blink and Rune of Mana'
            println "PASS: original Tomb of Sargeras $milestone; report: $report"
            return
        }
        if (islandCache != null) {
            if (!output.contains('[FrozenThroneOpeningProbe] restored Maiev and mined gold from the original NightElfX02 settlement')
                    || islandVoyage && !output.contains('[FrozenThroneOpeningProbe] sailed the original NightElfX02 channel with both passengers aboard')
                    || islandLandfall && !output.contains('[FrozenThroneOpeningProbe] disembarked the expedition and opened the original northern tomb approach')
                    || islandPlaythrough && (!output.contains('[FrozenThroneOpeningProbe] defeated the original Tomb Guardians')
                            || !output.contains('[FrozenThroneOpeningProbe] entered NightElfX03 and verified Maiev carryover'))
                    || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Frozen Throne opening audit:')) {
                throw new GradleException("Frozen Throne island opening failed; see $report")
            }
            def milestone = islandPlaythrough ? 'island victory and Maiev carryover into the Tomb of Sargeras'
                    : islandLandfall ? 'original northern island landing' : islandVoyage
                    ? 'original shipyard purchase and island channel voyage' : 'original island opening, Maiev carryover and gold income'
            println "PASS: Frozen Throne $milestone; report: $report"
            return
        }
        if (saveHarbor != null) {
            if (!output.contains('[FrozenThroneOpeningProbe] saved the original harbor approach') || !file(saveHarbor).isFile()) {
                throw new GradleException("Frozen Throne harbor checkpoint failed; see $report")
            }
            println "PASS: original Frozen Throne harbor checkpoint; report: $report; runtime home: $auditHome"
            return
        }
        if (!output.contains('[FrozenThroneOpeningProbe] reached Illidan\'s harbor and opened the original ship defense')
                || !output.contains('[FrozenThroneOpeningProbe] completed the original ship defense')
                || !output.contains('[FrozenThroneOpeningProbe] entered NightElfX02 and verified Maiev carryover')
