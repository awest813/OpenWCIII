// Separate JVMs share one fresh home; this checks persistence beyond an in-process reload.
def persistenceAuditHome = file("$buildDir/campaign-persistence-home-${System.currentTimeMillis()}")
def persistencePhases = [
    [label: 'WriteOriginal', phase: 'write-original', map: 'Human01.w3m', flow: true, objectives: true, hero: 'Carryover audit'],
    [label: 'WriteOther', phase: 'write-other', map: 'Human01.w3m', flow: true, objectives: false, hero: 'Other profile hero'],
    [label: 'ReadOriginal', phase: 'read-original', map: 'Human02.w3m', flow: false],
    [label: 'ReadOther', phase: 'read-other', map: 'Human02.w3m', flow: false],
    [label: 'RecreateOther', phase: 'recreate-other', map: 'Human02.w3m', flow: false]
]
def persistencePreviousTask = null
persistencePhases.each { scenario ->
    def taskName = "campaignPersistence${scenario.label}"
    def predecessor = persistencePreviousTask
    tasks.register(taskName, JavaExec) {
        dependsOn classes
        if (predecessor != null) dependsOn predecessor
        mainClass = project.mainClassName
        classpath = sourceSets.main.runtimeClasspath
        workingDir = project.assetsDir
        timeout = java.time.Duration.ofMinutes(3)
        systemProperty 'user.home', persistenceAuditHome.absolutePath
        systemProperty 'warsmash.campaignPersistenceAudit', scenario.phase
        systemProperty 'warsmash.campaignFlowAudit', scenario.flow.toString()
        systemProperty 'warsmash.campaignObjectiveEvents', (scenario.objectives ?: false).toString()
        if (scenario.hero != null) systemProperty 'warsmash.campaignFlowHeroName', scenario.hero
        args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog',
             '-loadfile', "Maps\\Campaign\\${scenario.map}"
        def auditOutput = new ByteArrayOutputStream()
        standardOutput = auditOutput
        errorOutput = auditOutput
        ignoreExitValue = true
        doFirst {
            def optionsFile = new File(persistenceAuditHome, '.warsmash/options.properties')
            optionsFile.parentFile.mkdirs()
            optionsFile.text = 'musicEnabled=false\nsoundEnabled=false\n'
        }
        doLast {
            def output = auditOutput.toString('UTF-8')
            def report = file("$buildDir/campaign-persistence-${scenario.phase}.log")
            report.text = output
            def marker = scenario.flow ? '[CampaignFlowProbe] complete' : "[CampaignPersistenceProbe] ${scenario.phase} complete"
            if (!output.contains(marker) || output.contains('GL ERROR:') || output.contains('JassException') ||
                    !output.contains("[CampaignPersistenceProbe] ${scenario.phase} selected")) {
                throw new GradleException("Campaign persistence phase failed; see $report")
            }
            println "PASS: ${scenario.phase}; report: $report"
        }
    }
    persistencePreviousTask = taskName
}
tasks.register('campaignPersistenceRenderAudit') {
    description = 'Verifies retail hero restoration and unlocks across five desktop processes, profile switching, and deletion/recreation.'
    dependsOn persistencePreviousTask
    doLast {
        println "PASS: campaign persistence across five separate client launches; isolated home: $persistenceAuditHome"
    }
}

def missionResumeProfile = 'p-' + java.security.MessageDigest.getInstance('SHA-256').digest('WorldEdit'.getBytes('UTF-8')).encodeHex().toString()
def missionResumeReadFps = (project.findProperty("missionResumeReadFps") ?: "30").toString()
def missionResumeScenario = project.findProperty("missionResumeScenario") ?: "basic"
def missionResumeTimeout = java.time.Duration.ofMinutes((missionResumeScenario.toString().startsWith('economy') || missionResumeScenario == 'battle') ? 5 : 3)
def missionResumeHome = file("$buildDir/mission-resume-home-${System.currentTimeMillis()}")
tasks.register('missionResumeWrite', JavaExec) {
    dependsOn classes
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = missionResumeTimeout
    systemProperty 'user.home', missionResumeHome.absolutePath
    systemProperty 'warsmash.missionResumeScenario', missionResumeScenario
    systemProperty 'warsmash.missionResumeAudit', 'write'
    systemProperty 'warsmash.missionResumeSaveOffset', project.findProperty('missionResumeSaveOffset') ?: '65'
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile', 'Maps\\Campaign\\Human01.w3m'
    def report = file("$buildDir/mission-resume-${missionResumeScenario}-write.log")
    def output = new FileOutputStream(report)
    standardOutput = output
    errorOutput = output
    ignoreExitValue = true
    doFirst {
        def options = new File(missionResumeHome, '.warsmash/options.properties')
        options.parentFile.mkdirs()
        options.text = 'musicEnabled=false\nsoundEnabled=false\n'
    }
    doLast {
        output.close()
        if (!report.getText('UTF-8').contains('[MissionResumeProbe] write complete')) throw new GradleException("Mission checkpoint write failed; see $report")
        println 'PASS: Quick Save, native SaveGame, and uninterrupted continuation'
    }
}
tasks.register('missionResumeRenderAudit', JavaExec) {
    dependsOn missionResumeWrite
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = missionResumeTimeout
    systemProperty 'user.home', missionResumeHome.absolutePath
    systemProperty 'warsmash.missionResumeScenario', missionResumeScenario
    systemProperty 'warsmash.missionResumeAudit', 'read'
    args '-profile', 'safe', '-window', '960', '540', '-fps', missionResumeReadFps, '-nolog', '-loadfile', new File(missionResumeHome, ".warsmash/saves/profiles/$missionResumeProfile/QuickSave.w3s").absolutePath
    def report = file("$buildDir/mission-resume-${missionResumeScenario}-read.log")
    def output = new FileOutputStream(report)
    standardOutput = output
    errorOutput = output
    ignoreExitValue = true
    doLast {
        output.close()
        def text = report.getText('UTF-8')
        if (!text.contains('[MissionResumeProbe] read complete') || text.contains('GL ERROR:') || text.contains('JassException')) throw new GradleException("Mission resume failed; see $report")
        println "PASS: mission resumed in a fresh process and matched uninterrupted continuation; home: $missionResumeHome"
    }
}

// Corrupt copies leave the successful save untouched and exercise the real failure/menu path.
tasks.register('missionResumeCorruptFixtures', JavaExec) {
    dependsOn missionResumeWrite
    mainClass = 'com.etheller.warsmash.desktop.tools.MissionCheckpointCorruptionFixture'
    classpath = sourceSets.main.runtimeClasspath
    args new File(missionResumeHome, ".warsmash/saves/profiles/$missionResumeProfile/QuickSave.w3s").absolutePath
}
def missionRejectTasks = []
['Engine', 'State'].each { kind ->
    def taskName = "missionResumeReject$kind"
    missionRejectTasks.add(taskName)
    tasks.register(taskName, JavaExec) {
        dependsOn missionResumeCorruptFixtures
        mainClass = project.mainClassName
        classpath = sourceSets.main.runtimeClasspath
        workingDir = project.assetsDir
        timeout = java.time.Duration.ofMinutes(3)
        systemProperty 'user.home', missionResumeHome.absolutePath
        def phase = 'reject-' + kind.toLowerCase()
        systemProperty 'warsmash.missionResumeScenario', missionResumeScenario
        systemProperty 'warsmash.missionResumeAudit', phase
        args '-profile', 'safe', '-window', '960', '540', '-fps', missionResumeReadFps, '-nolog', '-loadfile', new File(missionResumeHome, ".warsmash/saves/profiles/$missionResumeProfile/Wrong${kind}.w3s").absolutePath
        def report = file("$buildDir/mission-resume-${missionResumeScenario}-${phase}.log")
        def output = new FileOutputStream(report)
        standardOutput = output
        errorOutput = output
        ignoreExitValue = true
        doLast {
            output.close()
            if (!report.getText('UTF-8').contains("[MissionResumeProbe] $phase complete")) throw new GradleException("Checkpoint rejection audit failed; see $report")
            println "PASS: $phase checkpoint rejected and returned to menu"
        }
    }
}
tasks.register('missionResumeFailureAudit') {
    dependsOn missionResumeRenderAudit, missionRejectTasks
}
