def verifyHuman02PlaythroughReport = { File report, File auditHome, boolean chain ->
    def output = report.getText('UTF-8')
    if (!output.contains('[Human02PlaythroughProbe] complete:') || output.contains('GL ERROR:') || output.contains('JassException')
            || !['base-objectives', 'interlude', 'human03'].every { capture ->
                output.contains("[Human02PlaythroughProbe] captured $capture")
                        && new File(auditHome, "human02/${capture}.png").length() > 0
            }
            || (chain && !output.contains('[CampaignPlaythroughProbe] complete:'))) {
        throw new GradleException("Human02 playthrough failed; see $report")
    }
    def victory = new Properties()
    def restored = new Properties()
    new File(auditHome, 'human02/human02-victory.properties').withInputStream { victory.load(it) }
    new File(auditHome, 'human02/human03.properties').withInputStream { restored.load(it) }
    if (victory != restored) throw new GradleException("Human03 hero evidence differs; see $auditHome")
}

task human02PlaythroughReportAudit {
    description = 'Revalidates a retained Human02 desktop audit log, captures and carried-hero evidence.'
