            throw new GradleException("Campaign flow audit failed; see $report")
        }
        println "PASS: ${objectiveEvents ? 'retail objective events' : 'retail completion actions'}, defeat/retry, difficulty, victory, carryover, unlock persistence, next chapter, and menu return; report: $report"
    }
}

