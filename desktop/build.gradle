// Long audits retain their exact binaries while another audit is being repaired and recompiled.
def freezeAuditRuntime = { JavaExec audit, File home, boolean reuse ->
    def runtime = new File(home, 'runtime')
    if (!reuse) {
        if (!runtime.isDirectory() && !runtime.mkdirs()) {
            throw new GradleException("Cannot create audit runtime directory: $runtime")
        }
        audit.classpath.files.eachWithIndex { source, index ->
            def destination = new File(runtime, String.format('%03d-', index) + source.name)
            if (source.isDirectory()) copy { from source; into destination }
            else copy { from source; into runtime; rename { destination.name } }
        }
    }
    def binaries = runtime.listFiles()
    if (binaries == null || binaries.length == 0) {
        throw new GradleException("Audit runtime is missing or empty: $runtime; run the write phase first")
    }
    audit.classpath = files(binaries.sort { a, b -> a.name <=> b.name })
}
def human02ResumeHome = file("$buildDir/human02-resume-home-${System.currentTimeMillis()}")
def human02ResumeProfile = 'p-' + java.security.MessageDigest.getInstance('SHA-256').digest('WorldEdit'.getBytes('UTF-8')).encodeHex().toString()
['write', 'read'].each { phase ->
    tasks.register(phase == 'write' ? 'human02OptionalWrite' : 'human02OptionalResumeAudit', JavaExec) {
        description = 'Plays Human02 main/optional objectives, with an ordinary heart-item save and fresh-process continuation.'
        dependsOn phase == 'write' ? classes : 'human02OptionalWrite'
        mainClass = project.mainClassName
        classpath = sourceSets.main.runtimeClasspath
        workingDir = project.assetsDir
        timeout = java.time.Duration.ofMinutes(25)
        systemProperty 'user.home', human02ResumeHome.absolutePath
        systemProperty 'warsmash.human02PlaythroughAudit', 'true'
        systemProperty 'warsmash.human02OptionalAudit', 'true'
        systemProperty 'warsmash.human02PlaythroughPhase', phase
        args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile',
            phase == 'write' ? 'Maps\\Campaign\\Human02.w3m' : new File(human02ResumeHome,".warsmash/saves/profiles/$human02ResumeProfile/QuickSave.w3s").absolutePath
        def report = file("$buildDir/human02-optional-${phase}.log")
        ignoreExitValue = true
        doFirst {
            freezeAuditRuntime(delegate, human02ResumeHome, phase == 'read')
            def options = new File(human02ResumeHome,'.warsmash/options.properties'); options.parentFile.mkdirs()
            options.text = 'musicEnabled=false\nsoundEnabled=false\n'
            standardOutput = new FileOutputStream(report); errorOutput = standardOutput
        }
        doLast {
            standardOutput.close()
            verifyHuman02PlaythroughReport(report,human02ResumeHome,false)
            def output = report.getText('UTF-8')
            if (!output.contains('[Human02PlaythroughProbe] Searinox heart returned; Orb of Fire earned')
                    || !output.contains(phase == 'write' ? '[Human02PlaythroughProbe] actual Searinox Quick Save' : '[Human02PlaythroughProbe] Searinox checkpoint restored'))
                throw new GradleException("Human02 optional/save continuation failed; see $report")
            println "PASS: Human02 main/optional objectives and quest checkpoint $phase; report: $report; home: $human02ResumeHome"
        }
    }
}

task humanCampaignPlaythroughAudit(dependsOn: classes, type: JavaExec) {
    description = 'Plays retail Human campaign objectives and checks earned chapter carryover; later chapter drivers remain experimental.'
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = java.time.Duration.ofHours(4)
    def start = (project.findProperty('humanCampaignStart') ?: 'Human03').toString()
    def stop = (project.findProperty('humanCampaignStop') ?: 'Human04').toString()
    def auditHome = file("$buildDir/human-campaign-home-${System.currentTimeMillis()}")
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.humanCampaignAudit', 'true'
    systemProperty 'warsmash.humanCampaignStop', stop
    systemProperty 'warsmash.human02PlaythroughAudit', (start == 'Human01' || start == 'Human02').toString()
    systemProperty 'warsmash.campaignPlaythroughAudit', (start == 'Human01').toString()
    systemProperty 'warsmash.campaignPlaythroughFull', 'true'
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile', "Maps\\Campaign\\${start}.w3m"
    def report = file("$buildDir/human-campaign-${start.toLowerCase()}-${stop.toLowerCase()}.log")
    ignoreExitValue = true
    doFirst {
        freezeAuditRuntime(delegate, auditHome, false)
        def options = new File(auditHome, '.warsmash/options.properties'); options.parentFile.mkdirs()
        options.text = 'musicEnabled=false\nsoundEnabled=false\n'
        standardOutput = new FileOutputStream(report); errorOutput = standardOutput
    }
    doLast {
        standardOutput.close()
        def output = report.getText('UTF-8')
        def completedChapter = stop.equalsIgnoreCase('Complete') ? 'human09' : stop.toLowerCase()
        if (!output.contains("[HumanCampaignProbe] complete: reached $completedChapter")
                || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Human campaign audit:'))
            throw new GradleException("Human campaign playthrough failed; see $report")
        if (stop.equalsIgnoreCase('Complete') && !output.contains('[HumanCampaignProbe] final native Human campaign victory; Undead campaign unlocked'))
            throw new GradleException("Missing final Human campaign victory/unlock; see $report")
        println "PASS: retail Human campaign $start to $stop; report: $report; home: $auditHome"
    }
}

