    workingDir = project.assetsDir
    def playthrough = (project.findProperty('nightElfBarrowPlaythrough') ?: 'false').toString().toBoolean()
    def finaleVictory = (project.findProperty('nightElfFinaleVictory') ?: 'false').toString().toBoolean()
    def finaleOpening = finaleVictory || (project.findProperty('nightElfFinaleOpening') ?: 'false').toString().toBoolean()
    def defeatTichondrius = finaleOpening || (project.findProperty('nightElfDefeatTichondrius') ?: 'false').toString().toBoolean()
    def skullQuest = defeatTichondrius || (project.findProperty('nightElfSkullQuest') ?: 'false').toString().toBoolean()
    def dungeonPlaythrough = (project.findProperty('nightElfDungeonPlaythrough') ?: 'false').toString().toBoolean()
    def dungeonWaygate = dungeonPlaythrough || (project.findProperty('nightElfDungeonWaygate') ?: 'false').toString().toBoolean()
    def dungeonPlates = dungeonWaygate || (project.findProperty('nightElfDungeonPlates') ?: 'false').toString().toBoolean()
    def dungeonFurion = dungeonPlates || (project.findProperty('nightElfDungeonFurion') ?: 'false').toString().toBoolean()
    def dungeonBears = dungeonFurion || (project.findProperty('nightElfDungeonBears') ?: 'false').toString().toBoolean()
    def dungeonBridge = dungeonBears || (project.findProperty('nightElfDungeonBridge') ?: 'false').toString().toBoolean()
    def dungeonOpening = dungeonBridge || (project.findProperty('nightElfDungeonOpening') ?: 'false').toString().toBoolean()
    timeout = java.time.Duration.ofMinutes(playthrough || dungeonOpening || skullQuest ? 25 : 10)
    def auditHome = file("$buildDir/night-elf-barrow-home-${System.currentTimeMillis()}")
    def report = file("$buildDir/night-elf-barrow-opening.log")
    def earnedCache = project.findProperty('nightElfBarrowCache')
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.nightElfBarrowOpeningAudit', 'true'
    systemProperty 'warsmash.nightElfBarrowPlaythrough', playthrough.toString()
    systemProperty 'warsmash.nightElfSkullQuest', skullQuest.toString()
    systemProperty 'warsmash.nightElfDefeatTichondrius', defeatTichondrius.toString()
    systemProperty 'warsmash.nightElfFinaleOpening', finaleOpening.toString()
    systemProperty 'warsmash.nightElfFinaleVictory', finaleVictory.toString()
    systemProperty 'warsmash.nightElfDungeonOpening', dungeonOpening.toString()
    systemProperty 'warsmash.nightElfDungeonBridge', dungeonBridge.toString()
    systemProperty 'warsmash.nightElfDungeonBears', dungeonBears.toString()
    systemProperty 'warsmash.nightElfDungeonFurion', dungeonFurion.toString()
    systemProperty 'warsmash.nightElfDungeonPlates', dungeonPlates.toString()
    systemProperty 'warsmash.nightElfDungeonWaygate', dungeonWaygate.toString()
    systemProperty 'warsmash.nightElfDungeonPlaythrough', dungeonPlaythrough.toString()
    systemProperty 'warsmash.nightElfBarrowOpeningAuditTicksPerFrame', (project.findProperty('nightElfBarrowOpeningAuditTicksPerFrame') ?: '0').toString()
    def chapter = skullQuest ? 'NightElf06.w3m' : dungeonOpening ? 'NightElf05.w3m' : 'NightElf04.w3m'
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog', '-loadfile', "Maps\\Campaign\\${chapter}".toString()
    ignoreExitValue = true
    doFirst {
        if (dungeonOpening && earnedCache == null) throw new GradleException('The dungeon opening requires the earned NightElf04 cache')
        freezeAuditRuntime(delegate, auditHome, false)
        if (earnedCache != null) {
            def cacheDirectory = file(earnedCache)
            if (!cacheDirectory.isDirectory()) throw new GradleException("Campaign game cache directory does not exist: $cacheDirectory")
            copy {
                from cacheDirectory
                into new File(auditHome, '.warsmash/gamecache')
            }
        }
        def options = new File(auditHome, '.warsmash/options.properties')
        options.parentFile.mkdirs()
        options.text = 'musicEnabled=false\nsoundEnabled=false\n'
        standardOutput = new FileOutputStream(report); errorOutput = standardOutput
    }
    doLast {
        standardOutput.close()
        def output = report.getText('UTF-8')
        if (skullQuest) {
            if (!output.contains('[NightElfSkullProbe] watched the original introduction and discovered the Skull of Gul\'dan quest')
                    || !output.contains('[NightElfSkullProbe] destroyed the original Demon Gate and completed Illidan\'s Skull transformation')
                    || defeatTichondrius && (!output.contains('[NightElfSkullProbe] defeated the original Tichondrius and completed NightElf06')
                            || !output.contains('[NightElfSkullProbe] entered the original NightElf06 interlude'))
                    || finaleOpening && (!output.contains('[NightElfFinaleProbe] restored both earned heroes')
                            || !output.contains('[NightElfFinaleProbe] mined gold and trained a new Archer'))
                    || finaleVictory && (!output.contains('[NightElfFinaleProbe] survived the native Mount Hyjal countdown')
                            || !output.contains('[NightElfFinaleProbe] reached the original Night Elf campaign credits'))
                    || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Night Elf Skull audit:')) {
                throw new GradleException("NightElf06 Skull of Gul'dan playthrough failed; see $report")
            }
            println "PASS: NightElf06 original Demon Gate and Illidan's Skull transformation; report: $report"
            if (defeatTichondrius) println 'PASS: NightElf06 native victory and the original interlude'
            if (finaleOpening) println 'PASS: original NightElf07 restored both heroes and began the Mount Hyjal defence'
            if (finaleVictory) println 'PASS: original Mount Hyjal defence, native victory, and the Night Elf campaign credits'
            return
        }
        if (dungeonOpening) {
            if (!output.contains('[NightElfDungeonProbe] restored earned Tyrande and Furion after the original introduction')
                    || !output.contains('[NightElfDungeonProbe] the original dungeon gate split the heroes and replaced their quests')
                    || dungeonBridge && !output.contains('[NightElfDungeonProbe] Furion raised and crossed the original lava bridge')
                    || dungeonBears && !output.contains('[NightElfDungeonProbe] played the original Druid of the Claw encounter')
                    || dungeonFurion && !output.contains('[NightElfDungeonProbe] completed Furion\'s original quest and regained control of Tyrande')
                    || dungeonPlates && !output.contains('[NightElfDungeonProbe] activated both original pressure plates and opened Tyrande\'s gate')
                    || dungeonWaygate && !output.contains('[NightElfDungeonProbe] Tyrande travelled through the original prison waygate')
                    || dungeonPlaythrough && (!output.contains('[NightElfDungeonProbe] defeated the original prison guards, freed Illidan, and verified both stored heroes')
                            || !output.contains('[NightElfDungeonProbe] entered the original NightElf06 after freeing Illidan'))
                    || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Night Elf dungeon opening audit:')) {
                throw new GradleException("Night Elf dungeon opening failed; see $report")
            }
            def milestone = dungeonPlaythrough ? 'native prison victory, stored heroes, and NightElf06 transition'
                    : dungeonWaygate ? 'Tyrande\'s original prison waygate'
                    : dungeonPlates ? 'Tyrande\'s original pressure plate gate'
                    : dungeonFurion ? 'original Furion quest and return to Tyrande' : dungeonBears ? 'original Druid of the Claw encounter'
                    : dungeonBridge ? 'original lava bridge' : 'earned heroes, original introduction, and dungeon gate'
            println "PASS: NightElf05 $milestone; report: $report"
            return
        }
        if (!output.contains('[NightElfBarrowOpeningProbe] original construction event registered the Entangled Gold Mine')
                || !output.contains('[NightElfBarrowOpeningProbe] uprooted Tree of Ages took root and delivered the first gold')
                || playthrough && (!output.contains('[NightElfBarrowOpeningProbe] destroyed the original Satyr base')
                        || !output.contains('[NightElfBarrowOpeningProbe] Furion woke the Druids through the original quest')
                        || !output.contains('[NightElfBarrowOpeningProbe] entered NightElf05 and verified Tyrande and Furion carryover'))
                || output.contains('GL ERROR:') || output.contains('JassException') || output.contains('Night Elf barrow opening audit:')) {
            throw new GradleException("Night Elf barrow opening failed; see $report")
        }
        def milestone = playthrough ? 'NightElf04 Barrow Dens and both heroes carried into NightElf05' : 'NightElf04 mine established through original player orders'
        println "PASS: $milestone; report: $report; home: $auditHome"
    }
}

