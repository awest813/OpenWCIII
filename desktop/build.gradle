task campaignFlowRenderAudit(dependsOn: classes, type: JavaExec) {
    description = 'Executes retail defeat/retry and Human01-to-Human02 completion actions in the desktop client.'
    mainClass = project.mainClassName
    classpath = sourceSets.main.runtimeClasspath
    workingDir = project.assetsDir
    timeout = java.time.Duration.ofMinutes(3)
    def auditHome = file("$buildDir/campaign-flow-home-${System.currentTimeMillis()}")
    systemProperty 'user.home', auditHome.absolutePath
    systemProperty 'warsmash.campaignFlowAudit', 'true'
    def objectiveEvents = project.findProperty('campaignObjectiveEvents') == 'true'
    systemProperty 'warsmash.campaignObjectiveEvents', objectiveEvents.toString()
    args '-profile', 'safe', '-window', '960', '540', '-fps', '30', '-nolog',
         '-loadfile', 'Maps\\Campaign\\Human01.w3m'
    def auditOutput = new ByteArrayOutputStream()
    standardOutput = auditOutput
    errorOutput = auditOutput
    ignoreExitValue = true
    doFirst {
        def optionsFile = new File(auditHome, '.warsmash/options.properties')
        optionsFile.parentFile.mkdirs()
        optionsFile.text = 'musicEnabled=false\nsoundEnabled=false\n'
    }
    doLast {
        def output = auditOutput.toString('UTF-8')
        def report = file("$buildDir/${objectiveEvents ? 'campaign-objective-events' : 'campaign-flow'}.log")
        report.text = output
        if (!output.contains('[CampaignFlowProbe] complete') || output.contains('GL ERROR:') ||
                output.contains('JassException') ||
